<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JashServer - Live Aircraft</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
            font-family: Arial, sans-serif;
        }

        #hud {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            color: #d9f7ff;
            font-family: "Courier New", monospace;
            text-shadow: 0 0 8px rgba(120, 220, 255, .65);
        }

        .hud-title {
            position: absolute;
            top: 22px;
            left: 25px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .hud-subtitle {
            font-size: 10px;
            letter-spacing: 3px;
            opacity: .65;
        }

        .telemetry {
            position: absolute;
            left: 25px;
            bottom: 35px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .telemetry>div {
            min-width: 180px;
        }

        .label {
            display: inline-block;
            width: 70px;
            opacity: .6;
        }

        .value {
            font-size: 18px;
            font-weight: bold;
        }

        .unit {
            margin-left: 2px;
            opacity: .65;
        }

        .center-mark {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: bold;
            opacity: .7;
        }

        .h-line {
            position: absolute;
            width: 100px;
            border-top: 1px solid rgba(217, 247, 255, .45);
            left: 50%;
            top: 50%;
            transform: translateX(-50%);
        }

        .v-line {
            position: absolute;
            height: 70px;
            border-left: 1px solid rgba(217, 247, 255, .45);
            left: 50%;
            top: 50%;
            transform: translateY(-50%);
        }

        .system {
            position: absolute;
            right: 25px;
            bottom: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d9f7ff;
            box-shadow: 0 0 10px rgba(120, 220, 255, .9);
        }

        .rate {
            margin-left: 14px;
            opacity: .5;
        }

        canvas {
            display: block;
        }

        #engineButton {
            position: absolute;
            right: 25px;
            bottom: 60px;
            z-index: 20;

            padding: 12px 20px;

            background: rgba(0, 0, 0, 0.75);
            color: #d9f7ff;

            border: 1px solid rgba(180, 235, 255, 0.7);
            border-radius: 4px;

            font-family: "Courier New", monospace;
            font-size: 12px;
            letter-spacing: 2px;

            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="hud">
        <div class="hud-title">
            <span>JASHSERVER</span>
            <span class="hud-subtitle">FLIGHT CONTROL</span>
        </div>

        <div class="telemetry">
            <div><span class="label">ROLL</span><span class="value" id="roll">0.00</span><span class="unit">°</span>
            </div>
            <div><span class="label">PITCH</span><span class="value" id="pitch">0.00</span><span class="unit">°</span>
            </div>
            <div><span class="label">YAW</span><span class="value" id="yaw">0.00</span><span class="unit">°</span></div>
        </div>

        <div class="center-mark">+<div class="h-line"></div>
            <div class="v-line"></div>
        </div>

        <div class="system">
            <span class="dot" id="statusDot"></span>
            <span id="status">CONNECTING...</span>
            <span class="rate">IMU 20 Hz</span>
        </div>
    </div>
    <button id="engineButton">START ENGINE</button>


    <script type="importmap">
{
    "imports": {
        "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


    <script type="module">

        // =====================================================
        // THREE.JS IMPORTS
        // =====================================================

        import * as THREE from "three";

        import { GLTFLoader }
            from "three/addons/loaders/GLTFLoader.js";

        import { OrbitControls }
            from "three/addons/controls/OrbitControls.js";


        // =====================================================
        // ENGINE AUDIO
        // =====================================================

        const engineSound =
            new Audio("/sounds/su57.mp3");

        engineSound.loop = true;
        engineSound.volume = 0.35;
        engineSound.preload = "auto";


        const engineButton =
            document.getElementById("engineButton");


        engineButton.addEventListener(
            "click",
            async function () {

                try {

                    if (engineSound.paused) {

                        await engineSound.play();

                        engineButton.textContent =
                            "ENGINE ONLINE";

                        console.log(
                            "ENGINE STARTED"
                        );

                    }

                } catch (error) {

                    console.error(
                        "ENGINE AUDIO ERROR:",
                        error
                    );

                }

            }
        );


        // =====================================================
        // SCENE
        // =====================================================

        const scene =
            new THREE.Scene();

        scene.background =
            new THREE.Color(0x050505);


        // =====================================================
        // CAMERA
        // =====================================================

        const camera =
            new THREE.PerspectiveCamera(
                60,
                window.innerWidth /
                window.innerHeight,
                0.1,
                1000
            );

        camera.position.set(
            4,
            3,
            6
        );


        // =====================================================
        // FLIGHT ENVIRONMENT
        // =====================================================

        const flightEnvironment =
            new THREE.Group();

        scene.add(
            flightEnvironment
        );


        // =====================================================
        // INFINITE STAR FIELD
        // =====================================================

        const STAR_COUNT = 1000;

        const STAR_RANGE_X = 500;
        const STAR_RANGE_Y = 300;
        const STAR_RANGE_Z = 600;


        const starGeometry =
            new THREE.BufferGeometry();


        const starPositions =
            new Float32Array(
                STAR_COUNT * 3
            );


        for (
            let i = 0;
            i < STAR_COUNT;
            i++
        ) {

            const i3 =
                i * 3;


            starPositions[i3] =
                (Math.random() - 0.5)
                * STAR_RANGE_X;


            starPositions[i3 + 1] =
                (Math.random() - 0.5)
                * STAR_RANGE_Y;


            starPositions[i3 + 2] =
                (Math.random() - 0.5)
                * STAR_RANGE_Z;

        }


        starGeometry.setAttribute(
            "position",
            new THREE.BufferAttribute(
                starPositions,
                3
            )
        );


        const starMaterial =
            new THREE.PointsMaterial({

                size: 1.4,

                sizeAttenuation: true,

                transparent: true,

                opacity: 0.85

            });


        const stars =
            new THREE.Points(
                starGeometry,
                starMaterial
            );


        flightEnvironment.add(
            stars
        );


        // =====================================================
        // SPEED STREAKS
        // =====================================================

        const STREAK_COUNT = 250;


        const streakGeometry =
            new THREE.BufferGeometry();


        const streakPositions =
            new Float32Array(
                STREAK_COUNT * 6
            );


        for (
            let i = 0;
            i < STREAK_COUNT;
            i++
        ) {

            const i6 =
                i * 6;


            const x =
                (Math.random() - 0.5)
                * 400;


            const y =
                (Math.random() - 0.5)
                * 250;


            const z =
                (Math.random() - 0.5)
                * 500;


            streakPositions[i6] =
                x;

            streakPositions[i6 + 1] =
                y;

            streakPositions[i6 + 2] =
                z;


            streakPositions[i6 + 3] =
                x;

            streakPositions[i6 + 4] =
                y;

            streakPositions[i6 + 5] =
                z - 8;

        }


        streakGeometry.setAttribute(
            "position",
            new THREE.BufferAttribute(
                streakPositions,
                3
            )
        );


        const streakMaterial =
            new THREE.LineBasicMaterial({

                transparent: true,

                opacity: 0.0

            });


        const speedStreaks =
            new THREE.LineSegments(
                streakGeometry,
                streakMaterial
            );


        flightEnvironment.add(
            speedStreaks
        );

        // =====================================================
        // FLIGHT SPEED
        // =====================================================

        let flightSpeed = 0;

        let targetSpeed = 0;


        function updateFlightEnvironment() {

            // -------------------------------------------------
            // ENGINE → SPEED
            // -------------------------------------------------

            if (
                !engineSound.paused
            ) {

                targetSpeed = 2.0;

            } else {

                targetSpeed = 0.0;

            }


            // Smooth acceleration

            flightSpeed +=
                (
                    targetSpeed -
                    flightSpeed
                ) * 0.015;


            // -------------------------------------------------
            // MOVE STARS
            // -------------------------------------------------

            const positions =
                starGeometry
                    .attributes
                    .position
                    .array;


            for (
                let i = 0;
                i < STAR_COUNT;
                i++
            ) {

                const i3 =
                    i * 3;


                positions[i3 + 2] +=
                    flightSpeed;


                // Recycle star

                if (
                    positions[i3 + 2] > 50
                ) {

                    positions[i3 + 2] =
                        -STAR_RANGE_Z / 2;


                    positions[i3] =
                        (
                            Math.random() - 0.5
                        ) * STAR_RANGE_X;


                    positions[i3 + 1] =
                        (
                            Math.random() - 0.5
                        ) * STAR_RANGE_Y;

                }

            }


            starGeometry
                .attributes
                .position
                .needsUpdate = true;


            // -------------------------------------------------
            // MOVE SPEED STREAKS
            // -------------------------------------------------

            const streakData =
                streakGeometry
                    .attributes
                    .position
                    .array;


            for (
                let i = 0;
                i < STREAK_COUNT;
                i++
            ) {

                const i6 =
                    i * 6;


                streakData[i6 + 2] +=
                    flightSpeed;


                streakData[i6 + 5] +=
                    flightSpeed;


                if (
                    streakData[i6 + 2] > 50
                ) {

                    const x =
                        (
                            Math.random() - 0.5
                        ) * 400;


                    const y =
                        (
                            Math.random() - 0.5
                        ) * 250;


                    const z =
                        -250;


                    streakData[i6] =
                        x;

                    streakData[i6 + 1] =
                        y;

                    streakData[i6 + 2] =
                        z;


                    streakData[i6 + 3] =
                        x;

                    streakData[i6 + 4] =
                        y;

                    streakData[i6 + 5] =
                        z - 8;

                }

            }


            streakGeometry
                .attributes
                .position
                .needsUpdate = true;


            // -------------------------------------------------
            // SPEED STREAK INTENSITY
            // -------------------------------------------------

            streakMaterial.opacity =
                Math.min(
                    0.75,
                    flightSpeed * 0.25
                );


            // -------------------------------------------------
            // STAR INTENSITY
            // -------------------------------------------------

            starMaterial.opacity =
                0.55 +
                Math.min(
                    0.45,
                    flightSpeed * 0.1
                );
        }


        // =====================================================
        // RENDERER
        // =====================================================

        const renderer =
            new THREE.WebGLRenderer({

                antialias: true

            });


        renderer.setPixelRatio(
            window.devicePixelRatio
        );


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.shadowMap.enabled =
            true;


        document.body.appendChild(
            renderer.domElement
        );


        // =====================================================
        // CAMERA CONTROLS
        // =====================================================

        const controls =
            new OrbitControls(
                camera,
                renderer.domElement
            );


        controls.enableDamping =
            true;


        controls.dampingFactor =
            0.05;


        controls.target.set(
            0,
            0,
            0
        );


        // =====================================================
        // LIGHTING
        // =====================================================

        const ambientLight =
            new THREE.AmbientLight(
                0xffffff,
                2
            );


        scene.add(
            ambientLight
        );


        const directionalLight =
            new THREE.DirectionalLight(
                0xffffff,
                3
            );


        directionalLight.position.set(
            5,
            10,
            5
        );


        directionalLight.castShadow =
            true;


        scene.add(
            directionalLight
        );


        const secondLight =
            new THREE.DirectionalLight(
                0xffffff,
                1.5
            );


        secondLight.position.set(
            -5,
            3,
            -5
        );


        scene.add(
            secondLight
        );


        // =====================================================
        // AIRCRAFT
        // =====================================================

        let aircraft = null;

        // Afterburners live here so animate() can access them.
        let leftAfterburner = null;
        let rightAfterburner = null;


        const loader =
            new GLTFLoader();


        const MODEL_PATH =
            "/models/f22_raptor.glb";



        // =====================================================
        // AFTERBURNER CREATION
        // =====================================================
        function createAfterburner() {

            const burner = new THREE.Group();

            // =============================================
            // OUTER AFTERBURNER PLUME
            // =============================================

            const outerGeometry = new THREE.ConeGeometry(
                0.065,       // nozzle radius
                0.38,        // flame length
                24,
                8,
                true
            );

            const outerMaterial = new THREE.MeshBasicMaterial({
                color: 0xff5a00,
                transparent: true,
                opacity: 0.70,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide
            });

            const outer = new THREE.Mesh(
                outerGeometry,
                outerMaterial
            );

            // Exhaust travels toward local +Z.
            outer.rotation.x = Math.PI / 2;

            // Move the CENTER of the cone backward so
            // its BASE sits exactly at the burner origin.
            outer.position.z = 0.19;

            burner.add(outer);


            // =============================================
            // HOT CORE
            // =============================================

            const coreGeometry = new THREE.ConeGeometry(
                0.030,
                0.25,
                20,
                8,
                true
            );

            const coreMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffdd,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide
            });

            const core = new THREE.Mesh(
                coreGeometry,
                coreMaterial
            );

            core.rotation.x = Math.PI / 2;

            core.position.z = 0.125;

            burner.add(core);


            // =============================================
            // NOZZLE GLOW
            // =============================================

            const glowGeometry = new THREE.SphereGeometry(
                0.055,
                16,
                16
            );

            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0xff3300,
                transparent: true,
                opacity: 0.40,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const glow = new THREE.Mesh(
                glowGeometry,
                glowMaterial
            );

            // This stays exactly at the nozzle.
            glow.position.set(0, 0, 0);

            burner.add(glow);


            burner.userData.outer = outer;
            burner.userData.core = core;
            burner.userData.glow = glow;
            burner.userData.phase =
                Math.random() * Math.PI * 2;

            return burner;
        }


        // =====================================================
        // AFTERBURNER ANIMATION
        // =====================================================

        function updateAfterburners(time) {
            if (!leftAfterburner || !rightAfterburner) {
                return;
            }

            const engineOn = !engineSound.paused;

            for (const burner of [
                leftAfterburner,
                rightAfterburner
            ]) {
                const outer = burner.userData.outer;
                const core = burner.userData.core;
                const glow = burner.userData.glow;
                const phase = burner.userData.phase;

                if (!engineOn) {
                    outer.visible = false;
                    core.visible = false;
                    glow.visible = false;
                    continue;
                }

                outer.visible = true;
                core.visible = true;
                glow.visible = true;

                // Small independent flicker so the two engines
                // don't look like synchronized solid cones.
                const flicker =
                    1 +
                    Math.sin(time * 0.025 + phase) * 0.10 +
                    Math.sin(time * 0.061 + phase * 2.0) * 0.06;

                const pulse =
                    1 +
                    Math.sin(time * 0.018 + phase) * 0.12;

                outer.scale.set(
                    flicker,
                    flicker,
                    flicker *
                    (1 + Math.sin(time * 0.031 + phase) * 0.16)
                );

                core.scale.set(
                    0.85 + flicker * 0.15,
                    0.85 + flicker * 0.15,
                    pulse
                );

                glow.scale.setScalar(
                    0.9 +
                    Math.sin(time * 0.04 + phase) * 0.12
                );
            }
        }


        loader.load(

            MODEL_PATH,

            function (gltf) {

                aircraft =
                    gltf.scene;
                // TEMPORARY: inspect aircraft dimensions
                const aircraftBox = new THREE.Box3().setFromObject(aircraft);

                const aircraftSize = new THREE.Vector3();
                const aircraftCenter = new THREE.Vector3();

                aircraftBox.getSize(aircraftSize);
                aircraftBox.getCenter(aircraftCenter);

                console.log("AIRCRAFT SIZE:", aircraftSize);
                console.log("AIRCRAFT CENTER:", aircraftCenter);
                console.log("AIRCRAFT POSITION:", aircraft.position);

                scene.add(
                    aircraft
                );
                // =================================================
                // AFTERBURNERS
                // =================================================
                //
                // +Z = nose, -Z = tail on this F-22 model.
                // These are CHILDREN of aircraft, so they rotate
                // with the aircraft for roll, pitch and yaw.
                // =================================================

                leftAfterburner = createAfterburner();
                rightAfterburner = createAfterburner();

                aircraft.add(leftAfterburner);
                aircraft.add(rightAfterburner);

                // Initial nozzle positions in the model's local space.
                leftAfterburner.position.set(
                    -0.075,
                    0.02,
                    0.62
                );

                rightAfterburner.position.set(
                    0.075,
                    0.02,
                    0.62
                );

                // -------------------------------------------------
                // SHADOWS
                // -------------------------------------------------

                aircraft.traverse(
                    function (child) {

                        if (
                            child.isMesh
                        ) {

                            child.castShadow =
                                true;

                            child.receiveShadow =
                                true;

                        }

                    }
                );


                // -------------------------------------------------
                // CENTER AIRCRAFT
                // -------------------------------------------------

                const box =
                    new THREE.Box3()
                        .setFromObject(
                            aircraft
                        );


                const center =
                    box.getCenter(
                        new THREE.Vector3()
                    );


                aircraft.position.sub(
                    center
                );


                // -------------------------------------------------
                // SCALE AIRCRAFT
                // -------------------------------------------------

                const size =
                    box.getSize(
                        new THREE.Vector3()
                    );


                const maxDimension =
                    Math.max(
                        size.x,
                        size.y,
                        size.z
                    );


                const desiredSize =
                    4;


                const scale =
                    desiredSize /
                    maxDimension;


                aircraft.scale.setScalar(
                    scale
                );


                console.log(
                    "Aircraft loaded:",
                    aircraft
                );


                document.getElementById(
                    "status"
                ).textContent =
                    "Aircraft loaded";

            },


            function (progress) {

                if (
                    progress.total > 0
                ) {

                    const percent =
                        (
                            progress.loaded /
                            progress.total
                        ) * 100;


                    document.getElementById(
                        "status"
                    ).textContent =
                        "Loading aircraft " +
                        percent.toFixed(0) +
                        "%";

                }

            },


            function (error) {

                console.error(
                    "Aircraft loading error:",
                    error
                );


                document.getElementById(
                    "status"
                ).textContent =
                    "ERROR loading aircraft";

            }

        );


        // =====================================================
        // IMU VALUES
        // =====================================================

        let targetRoll = 0;
        let targetPitch = 0;
        let targetYaw = 0;


        let currentRoll = 0;
        let currentPitch = 0;
        let currentYaw = 0;


        // =====================================================
        // GET IMU DATA
        // =====================================================

        async function updateIMU() {

            try {

                const response =
                    await fetch(
                        "/imu"
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                // -------------------------------------------------
                // GET VALUES
                // -------------------------------------------------

                targetRoll =
                    data.roll;


                targetPitch =
                    data.pitch;


                targetYaw =
                    data.yaw;


                // -------------------------------------------------
                // DISPLAY VALUES
                // -------------------------------------------------

                document.getElementById(
                    "roll"
                ).textContent =
                    targetRoll.toFixed(2);


                document.getElementById(
                    "pitch"
                ).textContent =
                    targetPitch.toFixed(2);


                document.getElementById(
                    "yaw"
                ).textContent =
                    targetYaw.toFixed(2);


                // -------------------------------------------------
                // STATUS
                // -------------------------------------------------

                document.getElementById(
                    "status"
                ).textContent =
                    "IMU LINK ONLINE";


                document.getElementById(
                    "statusDot"
                ).style.opacity =
                    "1";

            }


            catch (error) {

                console.error(
                    "IMU error:",
                    error
                );


                document.getElementById(
                    "status"
                ).textContent =
                    "IMU LINK OFFLINE";


                document.getElementById(
                    "statusDot"
                ).style.opacity =
                    "0.25";

            }

        }


        // =====================================================
        // POLL SERVER
        // =====================================================

        // 50 ms = 20 Hz

        setInterval(
            updateIMU,
            50
        );


        updateIMU();


        // =====================================================
        // ANIMATION
        // =====================================================

        function animate(time = 0) {

            requestAnimationFrame(
                animate
            );


            // -------------------------------------------------
            // SMOOTH AIRCRAFT MOVEMENT
            // -------------------------------------------------

            currentRoll +=
                (
                    targetRoll -
                    currentRoll
                ) * 0.12;


            currentPitch +=
                (
                    targetPitch -
                    currentPitch
                ) * 0.12;


            currentYaw +=
                (
                    targetYaw -
                    currentYaw
                ) * 0.12;


            // -------------------------------------------------
            // APPLY IMU ORIENTATION
            // -------------------------------------------------

            if (
                aircraft
            ) {

                aircraft.rotation.x =
                    THREE.MathUtils.degToRad(
                        currentPitch
                    );


                aircraft.rotation.y =
                    THREE.MathUtils.degToRad(
                        currentYaw
                    );


                // Roll direction corrected

                aircraft.rotation.z =
                    THREE.MathUtils.degToRad(
                        -currentRoll
                    );

            }


            // -------------------------------------------------
            // AFTERBURNERS
            // -------------------------------------------------

            updateAfterburners(time);


            // -------------------------------------------------
            // UPDATE FLIGHT ENVIRONMENT
            // -------------------------------------------------

            updateFlightEnvironment();


            // -------------------------------------------------
            // CAMERA CONTROLS
            // -------------------------------------------------

            controls.update();


            // -------------------------------------------------
            // RENDER
            // -------------------------------------------------

            renderer.render(
                scene,
                camera
            );

        }


        animate();


        // =====================================================
        // WINDOW RESIZE
        // =====================================================

        window.addEventListener(
            "resize",
            function () {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );

    </script>

</body>

</html>
